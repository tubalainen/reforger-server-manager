# Reforger Server Manager — Windows 10/11 (Docker Desktop, WSL2 backend)
#
# Same stack as docker-compose.yaml, with one difference: state lives in Docker
# NAMED VOLUMES instead of folders next to this file. Server files are ~10 GB of
# Linux-owned files; keeping them on the Windows filesystem means slow 9p I/O and
# permission errors, while a named volume sits on the VM's native ext4 disk.
# Browse or back them up from Docker Desktop → Volumes.
#
# Start it with the desktop shortcut created by the installer, or by hand:
#   docker compose -f docker-compose.windows.yaml up -d
services:
  manager:
    # Tag comes from MANAGER_VERSION in .env: 'latest' follows every release,
    # or pin e.g. v0.31.0 to lock the manager to one version. start.ps1 pulls
    # this on start so 'latest' stays current.
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    container_name: reforger-manager
    restart: unless-stopped
    # On stop/down the manager gracefully stops every running game server and
    # removes their sibling containers (they are recorded and resumed on the
    # next start), so the network below has no leftover endpoints and
    # `docker compose down` succeeds. Stopping several Arma servers takes a
    # while — give the manager time before compose SIGKILLs it (default 10s).
    stop_grace_period: 2m
    env_file: .env
    environment:
      # Reach the host Docker daemon through the least-privilege proxy below
      # instead of mounting the root-equivalent socket into this container.
      # docker.from_env() honours DOCKER_HOST, so no application code changes.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    ports:
      # The web GUI. Server instances do NOT need port entries here: the
      # manager creates each Arma server as a *sibling* container on the host
      # Docker daemon and publishes its game/A2S/RCON UDP ports directly.
      # Docker Desktop forwards those published UDP ports onto the Windows
      # host, so players reach them once the WINDOWS firewall allows them
      # (defaults, configurable in .env):
      #   game  GAME_PORT_RANGE  2001-2020/udp
      #   A2S   A2S_PORT_RANGE   17777-17796/udp   (server browser query)
      #   RCON  RCON_PORT_RANGE  19999-20018/udp   (never expose to the internet)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-7780}:8080"
    volumes:
      # Manager state: SQLite DB, per-instance configs and profiles.
      - reforger-data:/data
      # NOTE: the raw Docker socket is deliberately NOT mounted here. The
      # manager reaches the daemon through the docker-socket-proxy service
      # below (DOCKER_HOST above), which exposes only the API sections it needs.
      # Downloaded server files, one volume per branch: written by the steamcmd
      # download jobs, mounted read-only here and into each server instance.
      - reforger-serverfiles-stable:/serverfiles/stable:ro
      - reforger-serverfiles-experimental:/serverfiles/experimental:ro
    networks:
      - reforger-net
      # Private link to the socket proxy; game containers are NOT on this one.
      - docker-api

  # Least-privilege gateway to the host Docker daemon (Docker Desktop / WSL2).
  # The manager reaches the daemon through this proxy instead of mounting the
  # root-equivalent socket itself; only the API sections it needs are forwarded,
  # everything else (exec, build, volume create, swarm, secrets, …) is denied.
  # Never published — reachable only by the manager over the internal network.
  # See docs/security-review-2026-07-27.md (R1): this shrinks the socket's
  # attack surface but the GUI must still stay off the open internet.
  docker-socket-proxy:
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1}
    container_name: reforger-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # create/list/inspect/start/stop/remove + logs + stats
      IMAGES: 1       # pull the server image, check it is present
      NETWORKS: 1     # inspect reforger-net for the attach self-heal (#113)
      INFO: 1         # docker info: Docker Desktop detection / firewall hint
      POST: 1         # allow write verbs (create/start/stop/remove/pull)
      # Everything not listed stays denied (image default 0).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # ONLY the private docker-api network — never shared with the game
      # servers, which run untrusted Workshop mods as root.
      - docker-api

# Explicit names so the manager can attach sibling server containers and so the
# volumes survive a rename of the folder this file sits in.
networks:
  reforger-net:
    name: reforger-net
  # Manager <-> socket proxy only; 'internal' keeps it off any external route.
  docker-api:
    name: reforger-docker-api
    internal: true

volumes:
  reforger-data:
    name: reforger-data
  reforger-serverfiles-stable:
    name: reforger-serverfiles-stable
  reforger-serverfiles-experimental:
    name: reforger-serverfiles-experimental
