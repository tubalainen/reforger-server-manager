services:
  manager:
    # Tag comes from MANAGER_VERSION in .env: 'latest' follows every release,
    # or pin e.g. v0.31.0 to lock the manager to one version. Run
    # `docker compose pull` to update when following latest.
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    # To build locally from source instead: comment 'image:', uncomment 'build:'
    # build: .
    container_name: reforger-manager
    restart: unless-stopped
    # On stop/down the manager gracefully stops every running game server and
    # removes their sibling containers (they are recorded and resumed on the
    # next start), so the network below has no leftover endpoints and
    # `docker compose down` succeeds. Stopping several Arma servers takes a
    # while — give the manager time before compose SIGKILLs it (default 10s).
    stop_grace_period: 2m
    env_file: .env
    environment:
      # Reach the host Docker daemon through the least-privilege proxy below
      # instead of mounting the root-equivalent socket into this container.
      # docker.from_env() honours DOCKER_HOST, so no application code changes.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    # Start the proxy first; on shutdown compose stops this service before the
    # proxy (reverse dependency order), so the graceful stop of the game servers
    # still has daemon access. The app tolerates a not-yet-ready daemon anyway.
    depends_on:
      - docker-socket-proxy
    ports:
      # The web GUI. Server instances do NOT need port entries here: the
      # manager creates each Arma server as a *sibling* container on the host
      # Docker daemon and publishes its game/A2S/RCON UDP ports directly to
      # the host (0.0.0.0) via the Docker API. Open these ranges in your host
      # firewall so players can connect (defaults, configurable in .env):
      #   game  GAME_PORT_RANGE  2001-2020/udp
      #   A2S   A2S_PORT_RANGE   17777-17796/udp   (server browser query)
      #   RCON  RCON_PORT_RANGE  19999-20018/udp   (only if used remotely)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-7780}:8080"
    volumes:
      # Manager state: SQLite DB, per-instance configs and profiles.
      # Ownership is fixed automatically by the container entrypoint.
      - ./data:/data
      # NOTE: the raw Docker socket is deliberately NOT mounted here. The
      # manager reaches the daemon through the docker-socket-proxy service
      # below (DOCKER_HOST above), which exposes only the API sections it needs.
      # Downloaded server files, one folder per branch: written by the
      # steamcmd download jobs, mounted into each server instance.
      # Kept as plain local folders so they are easy to inspect and back up.
      - ./serverfiles/stable:/serverfiles/stable:ro
      - ./serverfiles/experimental:/serverfiles/experimental:ro
    networks:
      - reforger-net
      # Private link to the socket proxy; game containers are NOT on this one.
      - docker-api

  # Least-privilege gateway to the host Docker daemon. Mounting
  # /var/run/docker.sock straight into the manager gives that container (and
  # thus anyone who reaches the GUI) root-equivalent control of the host. This
  # proxy holds the socket instead and only forwards the API sections the
  # manager actually uses; everything else — exec, build, volume create, swarm,
  # secrets, configs, plugins, system — is denied. It is never published, so it
  # is reachable only by the manager over the internal reforger-net.
  #
  # NOTE: this shrinks the socket's attack surface but does not remove the
  # daemon's inherent power to create containers with host bind mounts, so the
  # GUI must still be kept off the open internet (strong auth + a TLS reverse
  # proxy). See docs/security-review-2026-07-27.md (R1).
  docker-socket-proxy:
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1}
    container_name: reforger-docker-proxy
    restart: unless-stopped
    environment:
      # Enabled — exactly what the manager calls:
      CONTAINERS: 1   # create/list/inspect/start/stop/remove + logs + stats
      IMAGES: 1       # pull the server image, check it is present
      NETWORKS: 1     # inspect reforger-net for the attach self-heal (#113)
      INFO: 1         # docker info: Docker Desktop detection / firewall hint
      POST: 1         # allow write verbs (create/start/stop/remove/pull)
      # Everything not listed stays at the image default of 0 (denied):
      # EXEC, BUILD, COMMIT, VOLUMES, SWARM, SECRETS, CONFIGS, PLUGINS,
      # SYSTEM, AUTH, NODES, SERVICES, TASKS, SESSION, DISTRIBUTION.
    volumes:
      # Only this container touches the real socket (read-only bind).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # ONLY the private docker-api network. It must not share a network with
      # the game servers: those run untrusted Workshop mods as root, and a
      # network-reachable Docker API would hand them a container escape.
      - docker-api

# Explicit name so the manager can attach sibling server containers
# without depending on the compose project name.
networks:
  reforger-net:
    name: reforger-net
  # Manager <-> socket proxy only. 'internal' means no route off the host, so
  # the Docker API endpoint is unreachable from anywhere else, including the
  # game server containers that attach to reforger-net.
  docker-api:
    name: reforger-docker-api
    internal: true
