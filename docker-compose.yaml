# Reforger Server Manager — Linux.
#
# Every name below starts with the STACK name, RSM_STACK in .env ('reforger'
# when unset). One stack is one complete install: this manager, its Docker gate
# and the game servers it starts. Several can share one machine, each from its
# own folder with its own .env (#204).
services:
  manager:
    # Tag comes from MANAGER_VERSION in .env: 'latest' follows every release,
    # or pin e.g. v0.31.0 to lock the manager to one version. Run
    # `docker compose pull` to update when following latest.
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    # To build locally from source instead: comment 'image:', uncomment 'build:'
    # (and do the same for the Docker gate below, which runs the same image).
    # build: .
    container_name: ${RSM_STACK:-reforger}-manager
    restart: unless-stopped
    # On stop/down the manager gracefully stops every running game server and
    # removes their sibling containers (they are recorded and resumed on the
    # next start), so the network below has no leftover endpoints and
    # `docker compose down` succeeds. Stopping several Arma servers takes a
    # while — give the manager time before compose SIGKILLs it (default 10s).
    stop_grace_period: 2m
    env_file: .env
    environment:
      # Set here, not only in .env, so the manager always agrees with the names
      # this file gives the containers and the network.
      RSM_STACK: ${RSM_STACK:-reforger}
      DOCKER_NETWORK: ${RSM_STACK:-reforger}-net
      # Reach Docker through this stack's gate below, over a unix socket in a
      # volume only the two of them share. docker.from_env() honours DOCKER_HOST.
      DOCKER_HOST: unix:///run/rsm-gate/docker.sock
    # Start the gate first; on shutdown compose stops this service before the
    # gate (reverse dependency order), so the graceful stop of the game servers
    # still has daemon access. The app tolerates a not-yet-ready daemon anyway.
    depends_on:
      - docker-socket-proxy
    labels:
      # Which stack this manager is. The gate lets a manager inspect its own
      # container only when it carries this label.
      reforger-manager.stack: ${RSM_STACK:-reforger}
      reforger-manager.role: manager
      # What this stack takes on the host, so tools that look at every stack on
      # the machine can tell ports apart without reading anyone's .env.
      reforger-manager.web_port: ${WEB_PORT:-7780}
      reforger-manager.game_ports: ${GAME_PORT_RANGE:-2001-2020}
      reforger-manager.a2s_ports: ${A2S_PORT_RANGE:-17777-17796}
      reforger-manager.rcon_ports: ${RCON_PORT_RANGE:-19999-20018}
    ports:
      # The web GUI. Server instances do NOT need port entries here: the
      # manager creates each Arma server as a *sibling* container on the host
      # Docker daemon and publishes its game/A2S/RCON UDP ports directly to
      # the host (0.0.0.0) via the Docker API. Open these ranges in your host
      # firewall so players can connect (defaults, configurable in .env):
      #   game  GAME_PORT_RANGE  2001-2020/udp
      #   A2S   A2S_PORT_RANGE   17777-17796/udp   (server browser query)
      #   RCON  RCON_PORT_RANGE  19999-20018/udp   (only if used remotely)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-7780}:8080"
    volumes:
      # Manager state: SQLite DB, per-instance configs and profiles.
      # Ownership is fixed automatically by the container entrypoint.
      - ./data:/data
      # The gate's socket. The raw Docker socket is deliberately NOT mounted
      # here: only the gate holds it.
      - docker-gate:/run/rsm-gate
      # Downloaded server files, one folder per branch: written by the
      # steamcmd download jobs, mounted into each server instance.
      # Kept as plain local folders so they are easy to inspect and back up.
      - ./serverfiles/stable:/serverfiles/stable:ro
      - ./serverfiles/experimental:/serverfiles/experimental:ro
    networks:
      - reforger-net
      # Private link to the optional Ollama service below (#199).
      - reforger-ai
    # Lets AI_ORDER_URL reach an Ollama installed on this host rather than in
    # Docker (http://host.docker.internal:11434). Docker Desktop has this name
    # built in; Linux needs it spelled out. Harmless when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The Docker gate (v0.65.0): the only container in this stack that holds the
  # Docker socket. The manager sends every Docker request through it, and it
  # passes on only what the manager needs, for this stack only:
  #   * other stacks' containers do not exist, as far as this manager can tell;
  #   * containers may only be created from the two images in .env, with this
  #     stack's name and label, never privileged, never in the host's process
  #     or user namespaces, and mounting nothing but this stack's own folders;
  #   * exec, build, volumes, swarm, secrets, plugins and the rest are refused.
  # It has no network at all, so nothing can reach it over one — not the game
  # servers (host networking, #150) and not the host. The rules are in
  # backend/gate/policy.py. The service keeps the old socket proxy's name so
  # that `docker compose up` replaces that container instead of orphaning it.
  docker-socket-proxy:
    # The gate is part of the manager's image; keep the two on the same tag.
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    # build: .
    container_name: ${RSM_STACK:-reforger}-docker-gate
    restart: unless-stopped
    entrypoint: ["python", "-m", "gate"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Only what the rules need — deliberately not .env, which holds passwords.
    environment:
      RSM_STACK: ${RSM_STACK:-reforger}
      DOCKER_NETWORK: ${RSM_STACK:-reforger}-net
      REFORGER_SERVER_IMAGE: ${REFORGER_SERVER_IMAGE:-ghcr.io/acemod/arma-reforger:latest}
      STEAMCMD_IMAGE: ${STEAMCMD_IMAGE:-steamcmd/steamcmd:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-gate:/run/rsm-gate
      # The folders this stack's containers may mount: the gate reads their
      # host paths off these mounts, so they must be the same folders the
      # manager mounts above. It never reads what is in them.
      - ./data:/stack/data:ro
      - ./serverfiles/stable:/stack/serverfiles/stable:ro
      - ./serverfiles/experimental:/stack/serverfiles/experimental:ro

  # OPTIONAL local AI for the template wizard's "AI order" button (#199). Not
  # started unless the 'ollama' profile is on: add COMPOSE_PROFILES=ollama to
  # .env, then `docker compose up -d` and download a model once:
  #   docker exec reforger-ollama ollama pull qwen2.5:3b
  # (the container is <RSM_STACK>-ollama if you set RSM_STACK), and point the
  # manager at it in .env: AI_ORDER_URL=http://ollama:11434
  # Nothing is published: only the manager can reach it, over reforger-ai.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ${RSM_STACK:-reforger}-ollama
    restart: unless-stopped
    profiles: [ollama]
    volumes:
      # Downloaded models (a few GB each).
      - ./ollama:/root/.ollama
    # Use the NVIDIA GPU. Needs the NVIDIA driver and the NVIDIA Container Toolkit
    # on the host (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
    # No NVIDIA GPU? Delete this 'deploy:' block and Ollama runs on the CPU —
    # it works, but ordering a long mod list then takes minutes.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - reforger-ai

# Explicit names so the manager can attach sibling server containers without
# depending on the compose project name.
networks:
  reforger-net:
    name: ${RSM_STACK:-reforger}-net
  # Manager <-> the optional Ollama service only. Game servers are never on
  # it (they run untrusted Workshop mods), and it is not 'internal' because
  # Ollama has to reach the internet to download models.
  reforger-ai:
    name: ${RSM_STACK:-reforger}-ai

volumes:
  # Holds the gate's unix socket; shared by this stack's manager and gate only.
  docker-gate:
    name: ${RSM_STACK:-reforger}-docker-gate
