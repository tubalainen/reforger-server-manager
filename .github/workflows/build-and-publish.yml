name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history AND tags: the release guard below diffs against the last
          # released tag, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint backend (ruff)
        run: python -m ruff check backend/ scripts/ci/

      # The version lives in two files that no build stage can see at once, so it
      # cannot have a single source — but it can refuse to drift (#86).
      - name: Check backend and frontend versions agree
        run: |
          python - <<'EOF'
          import json, re, sys, pathlib
          backend = re.search(r'APP_VERSION = "([^"]+)"',
                              pathlib.Path("backend/config.py").read_text()).group(1)
          frontend = json.loads(pathlib.Path("frontend/package.json").read_text())["version"]
          if backend != frontend:
              sys.exit(f"version drift: backend/config.py={backend} frontend/package.json={frontend}")
          print(f"version {backend} — consistent")
          EOF

      # Users own their .env and compose file: an image pull never updates those,
      # so a release that changes them has to say so in its notes, or the change
      # silently never reaches anyone (#167).
      - name: Check the release notes tell users what to update
        run: python scripts/ci/release_guard.py

      - name: Run backend tests
        run: python -m pytest backend/tests scripts/ci -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Two stacks on one real Docker host, each behind its own Docker gate (#204).
  # Unit tests cover the gate's rules against a fake daemon; this is the part
  # only a real one can show: the compose wiring, the socket in its volume, the
  # manager finding its own mounts through the gate, and each stack blind to
  # the other.
  gate-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the manager image (the gate runs the same one)
        run: docker build -t ghcr.io/tubalainen/reforger-server-manager:e2e .

      - name: Start two stacks side by side
        run: |
          set -eu
          # The default stack keeps the pre-stacks names; team2 is a second install.
          for s in reforger team2; do
            dir="$RUNNER_TEMP/$s"
            # The compose file binds its volumes to these; they must exist.
            mkdir -p "$dir/data" "$dir/serverfiles/stable" "$dir/serverfiles/experimental"
            cp docker-compose.yaml "$dir/"
          done
          common="MANAGER_VERSION=e2e
          ADMIN_USERNAME=admin
          SESSION_SECRET=$(openssl rand -hex 32)
          REFORGER_SERVER_IMAGE=alpine:3.20
          STEAMCMD_IMAGE=busybox:1.36"
          printf '%s\nADMIN_PASSWORD=e2e-password-one\nWEB_PORT=7781\n' "$common" \
            | sed 's/^ *//' > "$RUNNER_TEMP/reforger/.env"
          printf '%s\nADMIN_PASSWORD=e2e-password-two\nWEB_PORT=7782\nRSM_STACK=team2\nCOMPOSE_PROJECT_NAME=team2\nGAME_PORT_RANGE=2101-2120\nA2S_PORT_RANGE=17877-17896\nRCON_PORT_RANGE=20099-20118\n' "$common" \
            | sed 's/^ *//' > "$RUNNER_TEMP/team2/.env"
          for s in reforger team2; do
            (cd "$RUNNER_TEMP/$s" && docker compose up -d)
          done
          for port in 7781 7782; do
            for _ in $(seq 60); do
              curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null && break
              sleep 2
            done
            curl -fsS "http://127.0.0.1:$port/api/health"
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}'

      - name: The gates have no network and hold the only Docker socket
        run: |
          set -eu
          for s in reforger team2; do
            test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$s-docker-gate")" = none
            if docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$s-manager" | grep -q docker.sock; then
              echo "$s-manager mounts the Docker socket"; exit 1
            fi
          done
          # Nothing listens for the Docker API on TCP any more.
          ! ss -ltn | grep -E ':2375|:2376'

      - name: Each gate lets its stack work and keeps it to itself
        run: |
          set -eu
          docker exec -i -u app -e OTHER_STACK=team2 reforger-manager \
            python - < scripts/ci/gate_e2e_inside.py
          docker exec -i -u app -e OTHER_STACK=reforger team2-manager \
            python - < scripts/ci/gate_e2e_inside.py

      - name: The host admin's password reset runs inside a manager
        run: |
          set -eu
          docker exec -u app team2-manager python manage.py reset-password | tee reset.log
          grep -q 'No password was set in the GUI' reset.log
          # As root it refuses: files it wrote would lock the manager out.
          if docker exec team2-manager python manage.py reset-password; then
            echo "it ran as root"; exit 1
          fi

      - name: The GUIs raise no Docker warning
        run: |
          set -eu
          check() {  # check <port> <password>
            jar=$(mktemp)
            curl -fsS -c "$jar" -H 'Content-Type: application/json' \
              -d "{\"username\":\"admin\",\"password\":\"$2\"}" \
              "http://127.0.0.1:$1/api/auth/login" >/dev/null
            warnings=$(curl -fsS -b "$jar" "http://127.0.0.1:$1/api/system/warnings")
            echo "$1: $warnings"
            ! echo "$warnings" | grep -qE 'docker_gate|docker_api_exposed'
          }
          check 7781 e2e-password-one
          check 7782 e2e-password-two

      - name: Logs
        if: always()
        run: |
          for s in reforger team2; do
            echo "::group::$s"
            (cd "$RUNNER_TEMP/$s" && docker compose logs --no-color --tail 200) || true
            echo "::endgroup::"
          done

  # The host administrator's side of several stacks (#204): the real Linux
  # installer, then rsm adding, listing, checking and removing a second stack,
  # under dash (Ubuntu's /bin/sh). The images are the published ones — this
  # tests the scripts, not the manager.
  rsm-e2e:
    runs-on: ubuntu-latest
    env:
      # The scripts fetch their files from this branch, as they would from main.
      RSM_REF: ${{ github.head_ref || github.ref_name }}
      RSM_ASSUME_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the first stack with the installer
        run: sudo -E RSM_BIND=local sh scripts/linux/install-local.sh

      - name: rsm knows it, and adopts the file of older versions
        run: |
          set -eux
          test -f /etc/reforger-server-manager/stacks/reforger.conf
          test ! -e /etc/reforger-server-manager.conf
          sudo rsm stacks | grep -E '^reforger +7780 +running +yes'
          # A pre-v0.66.0 machine had only /etc/reforger-server-manager.conf.
          sudo mv /etc/reforger-server-manager/stacks/reforger.conf /etc/reforger-server-manager.conf
          sudo rsm stacks | grep -q '^reforger'
          test -f /etc/reforger-server-manager/stacks/reforger.conf
          test ! -e /etc/reforger-server-manager.conf
          # One stack: no --stack needed.
          sudo rsm status

      - name: A second install refuses to go over the first
        run: |
          if sudo -E RSM_DIR=/opt/other RSM_BIND=local sh scripts/linux/install-local.sh; then
            echo "the installer installed a second copy"; exit 1
          fi

      - name: rsm add-stack sets up a second team
        run: |
          set -eux
          sudo -E rsm add-stack team2 | tee add.log
          grep -q 'Stack .team2. is up' add.log
          test -f /opt/rsm-team2/.env
          grep -q '^RSM_STACK=team2$' /opt/rsm-team2/.env
          grep -q '^COMPOSE_PROJECT_NAME=team2$' /opt/rsm-team2/.env
          grep -q '^WEB_PORT=7781$' /opt/rsm-team2/.env
          grep -q '^GAME_PORT_RANGE=2021-2040$' /opt/rsm-team2/.env
          for port in 7780 7781; do
            for _ in $(seq 60); do
              curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null && break
              sleep 2
            done
            curl -fsS "http://127.0.0.1:$port/api/health"
          done
          sudo rsm stacks
          sudo rsm ports | tee ports.log
          grep -q 'No overlaps' ports.log

      - name: With two stacks rsm asks which, and --all does both
        run: |
          set -eux
          if sudo rsm status 2> which.log; then echo "rsm guessed a stack"; exit 1; fi
          grep -q 'several stacks' which.log
          sudo rsm status --stack team2
          sudo rsm --all status
          docker ps --format '{{.Names}}' | sort | tee names.log
          grep -qx team2-docker-gate names.log
          grep -qx reforger-docker-gate names.log

      - name: rsm ports flags an overlap
        run: |
          set -eux
          sudo sed -i 's/^WEB_PORT=7781$/WEB_PORT=7780/' /opt/rsm-team2/.env
          if sudo rsm ports; then echo "overlap not reported"; exit 1; fi
          sudo sed -i 's/^WEB_PORT=7780$/WEB_PORT=7781/' /opt/rsm-team2/.env

      - name: rsm remove-stack takes the second team away again
        run: |
          set -eux
          sudo -E rsm remove-stack team2
          test ! -e /etc/reforger-server-manager/stacks/team2.conf
          test ! -e /opt/rsm-team2
          ! docker ps -a --format '{{.Names}}' | grep -q '^team2-'
          sudo rsm stacks | grep -q '^reforger'
          curl -fsS http://127.0.0.1:7780/api/health

      - name: Logs
        if: always()
        run: |
          sudo rsm --all status || true
          docker ps -a || true

  publish:
    needs: [test, gate-e2e, rsm-e2e]
    # Publish on pushes to main and on version tags, never for PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
