# Reforger Server Manager — VPS deployment (public server, automatic HTTPS)
#
# Hardened variant of docker-compose.yaml for a machine that is ON the internet.
# Differences from the plain file:
#
#   * Caddy terminates TLS and is the ONLY thing published on the web. It gets a
#     real Let's Encrypt certificate automatically on first start.
#   * The manager publishes NO port at all. It is reachable only through Caddy
#     over an internal Docker network — there is no way to hit the GUI directly.
#   * Caddy and the manager share a network of their own; the game servers are
#     never on it (see the network notes at the bottom).
#
# Every name below starts with the STACK name, RSM_STACK in .env ('reforger'
# when unset) — see docker-compose.yaml (#204).
#
# Start it with:
#   docker compose -f docker-compose.vps.yaml up -d
#
# See the "Running on a VPS" section of README.md for the full walkthrough.
services:
  # --- TLS reverse proxy ------------------------------------------------------
  # One-liner reverse-proxy mode: no Caddyfile to download, and HTTPS (including
  # certificate issuance and renewal) is fully automatic when SITE_ADDRESS is a
  # domain name. WebSocket upgrades — the live server log and the download
  # progress bars — are proxied natively with no extra configuration.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: ${RSM_STACK:-reforger}-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${SITE_ADDRESS:?set SITE_ADDRESS in .env (a domain name, or ":80" for plain-HTTP IP-only testing)} --to manager:8080
    ports:
      # 80 is required even on an HTTPS-only site: Let's Encrypt validates over
      # it, and Caddy redirects http->https from it.
      - "80:80"
      - "443:443"
    volumes:
      # Certificates live here. Keep this volume — losing it means re-issuing on
      # every restart, which will eventually hit Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    depends_on:
      - manager

  # --- The manager ------------------------------------------------------------
  manager:
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    container_name: ${RSM_STACK:-reforger}-manager
    restart: unless-stopped
    # The manager stops every running game server on the way down; give it time
    # before compose SIGKILLs it (default is 10s).
    stop_grace_period: 2m
    env_file: .env
    environment:
      # Set here, not only in .env, so the manager always agrees with the names
      # this file gives the containers and the network.
      RSM_STACK: ${RSM_STACK:-reforger}
      DOCKER_NETWORK: ${RSM_STACK:-reforger}-net
      # Reach Docker through this stack's gate below, over a unix socket in a
      # volume only the two of them share — never the raw socket.
      DOCKER_HOST: unix:///run/rsm-gate/docker.sock
      # Arms the startup security gate. The GUI has no published port here, so
      # the app cannot otherwise tell it is internet-facing — but it IS, via
      # Caddy. This makes it refuse to start on the example/empty password, the
      # same protection a directly-exposed deployment gets. It does NOT publish
      # a port (there is no 'ports:' below); it is only a truthfulness signal.
      #
      # Hardcoded on purpose: NOT ${WEB_BIND:-...}. .env ships WEB_BIND=127.0.0.1
      # for the localhost quick start, and letting that leak in here would
      # silently disarm the gate on the one deployment that most needs it.
      WEB_BIND: "0.0.0.0"
      # Believe Caddy's X-Forwarded-For, so login throttling applies per real
      # client instead of collapsing into one shared bucket keyed on Caddy (which
      # would let a single attacker lock every operator out). Scoped to the
      # proxy network's subnet — which is pinned below precisely so this can name
      # it — and to nothing else.
      TRUSTED_PROXIES: ${PROXY_SUBNET:-172.31.242.0/24}
    depends_on:
      - docker-socket-proxy
    labels:
      # Which stack this manager is. The gate lets a manager inspect its own
      # container only when it carries this label.
      reforger-manager.stack: ${RSM_STACK:-reforger}
      reforger-manager.role: manager
      reforger-manager.game_ports: ${GAME_PORT_RANGE:-2001-2020}
      reforger-manager.a2s_ports: ${A2S_PORT_RANGE:-17777-17796}
      reforger-manager.rcon_ports: ${RCON_PORT_RANGE:-19999-20018}
    # NOTE: deliberately no 'ports:'. The GUI is reachable only via Caddy.
    volumes:
      - ./data:/data
      - docker-gate:/run/rsm-gate   # the gate's socket; never the raw one
      - ./serverfiles/stable:/serverfiles/stable:ro
      - ./serverfiles/experimental:/serverfiles/experimental:ro
    networks:
      - proxy          # inbound from Caddy
      - reforger-net   # shared with the game server containers

  # --- The Docker gate (v0.65.0) ----------------------------------------------
  # The only container that holds the Docker socket. It passes on only what the
  # manager needs, for this stack only, and has no network at all: nothing can
  # reach it over one — not Caddy, not the game servers, not the host. See
  # docker-compose.yaml for what it allows; the rules are in
  # backend/gate/policy.py. The service keeps the old socket proxy's name so
  # that compose replaces that container instead of orphaning it.
  docker-socket-proxy:
    # The gate is part of the manager's image; keep the two on the same tag.
    image: ghcr.io/tubalainen/reforger-server-manager:${MANAGER_VERSION:-latest}
    container_name: ${RSM_STACK:-reforger}-docker-gate
    restart: unless-stopped
    entrypoint: ["python", "-m", "gate"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Only what the rules need — deliberately not .env, which holds passwords.
    environment:
      RSM_STACK: ${RSM_STACK:-reforger}
      DOCKER_NETWORK: ${RSM_STACK:-reforger}-net
      REFORGER_SERVER_IMAGE: ${REFORGER_SERVER_IMAGE:-ghcr.io/acemod/arma-reforger:latest}
      STEAMCMD_IMAGE: ${STEAMCMD_IMAGE:-steamcmd/steamcmd:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-gate:/run/rsm-gate
      # The folders this stack's containers may mount: the gate reads their
      # host paths off these mounts, so they must be the same folders the
      # manager mounts above. It never reads what is in them.
      - ./data:/stack/data:ro
      - ./serverfiles/stable:/stack/serverfiles/stable:ro
      - ./serverfiles/experimental:/stack/serverfiles/experimental:ro

# Two networks, so that every component can reach exactly what it needs and
# nothing else (the Docker gate has none at all):
#
#   proxy        Caddy <-> manager. Caddy is internet-facing, so it is kept off
#                the other network: a Caddy compromise reaches the GUI (which
#                still has its own login) and nothing else.
#   reforger-net manager <-> the game server containers (the network the manager
#                attaches each spawned server to).
networks:
  proxy:
    name: ${RSM_STACK:-reforger}-proxy
    # Pinned so TRUSTED_PROXIES above can name it: Docker would otherwise assign
    # this subnet dynamically and the manager could not know which source
    # addresses are really Caddy. Override PROXY_SUBNET in .env if it collides
    # with something already on the host ('docker compose up' will say so).
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.242.0/24}
  reforger-net:
    name: ${RSM_STACK:-reforger}-net

volumes:
  caddy-data:
    name: ${RSM_STACK:-reforger}-caddy-data
  caddy-config:
    name: ${RSM_STACK:-reforger}-caddy-config
  # Holds the gate's unix socket; shared by this stack's manager and gate only.
  docker-gate:
    name: ${RSM_STACK:-reforger}-docker-gate
